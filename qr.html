<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор QR-кода для оплаты</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1); }
        button { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #1557b0; }
        .btn-secondary { background-color: #f3f4f6; color: #374151; margin-top: 10px; font-size: 14px; padding: 10px; }
        .btn-secondary:hover { background-color: #e5e7eb; }
        .qr-wrapper { margin-top: 25px; display: flex; flex-direction: column; align-items: center; padding: 15px; background: #f9fafb; border-radius: 12px; border: 1px dashed #d1d5db; }
        #qrcode { display: flex; justify-content: center; align-items: center; min-height: 200px; }
        #qrcode svg { max-width: 100%; height: auto; }
        .note { font-size: 12px; color: #6b7280; text-align: center; margin-top: 15px; line-height: 1.4; }
        .requisites-info { font-size: 11px; color: #9ca3af; text-align: center; margin-bottom: 15px; background: #f3f4f6; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Оплата по QR-коду</h2>
    
    <!-- Блок с информацией о том, чьи реквизиты зашиты -->
    <div class="requisites-info">
        Получатель: <b id="displayPayee">Загрузка...</b><br>
        Счет: <span id="displayAcc">...</span>
    </div>

    <div class="form-group">
        <label for="sum">Сумма платежа (₽):</label>
        <input type="number" id="sum" placeholder="Например: 1500.50" step="0.01" min="0.01">
    </div>
    
    <div class="form-group">
        <label for="payerName">ФИО плательщика:</label>
        <input type="text" id="payerName" placeholder="Иванов Иван Иванович">
    </div>
    
    <div class="form-group">
        <label for="purpose">Назначение платежа:</label>
        <input type="text" id="purpose" placeholder="Например: Оплата по счету №123">
    </div>
    
    <button onclick="generateQR()">Сформировать QR-код</button>
    
    <div class="qr-wrapper">
        <div id="qrcode">
            <span style="color: #9ca3af; font-size: 14px;">QR-код появится здесь</span>
        </div>
        <div class="note">Отсканируйте этот код в приложении любого банка (СберБанк, Тинькофф, Альфа и др.)<br>Стандарт: ГОСТ Р 56042-2014</div>
    </div>

    <button class="btn-secondary" onclick="downloadSelf()">💾 Скачать этот генератор как HTML-файл</button>
</div>

<script>
// =====================================================================
// 1. НАСТРОЙКИ: ЗАШИТЫЕ РЕКВИЗИТЫ ПОЛУЧАТЕЛЯ (ИЗМЕНИТЕ ПОД СЕБЯ)
// =====================================================================
const REQUISITES = {
    name: 'ООО «Тестовая Компания»',       // Название получателя
    acc: '40702810938000000045',           // Расчетный счет (20 цифр)
    bank: 'ПАО СБЕРБАНК',                  // Название банка
    bic: '044525225',                      // БИК (9 цифр)
    corAcc: '30101810400000000225',        // Корреспондентский счет (20 цифр)
    inn: '7704400000',                     // ИНН получателя (10 или 12 цифр)
    kpp: '770401001'                       // КПП (9 цифр, оставьте пустым '', если ИП)
};

// Отображаем часть реквизитов на странице для проверки
document.getElementById('displayPayee').textContent = REQUISITES.name;
document.getElementById('displayAcc').textContent = REQUISITES.acc;

// =====================================================================
// 2. ЛОГИКА ГЕНЕРАЦИИ QR-КОДА
// =====================================================================
function generateQR() {
    const sumVal = document.getElementById('sum').value.trim();
    const payerName = document.getElementById('payerName').value.trim();
    const purpose = document.getElementById('purpose').value.trim();

    if (!sumVal || parseFloat(sumVal) <= 0) {
        alert('Пожалуйста, введите корректную сумму платежа.');
        return;
    }

    // Формирование строки по ГОСТ Р 56042-2014
    // Сумма указывается в копейках (целое число)
    const sumInKopecks = Math.round(parseFloat(sumVal) * 100);
    
    let qrString = `ST00012|Name=${REQUISITES.name}|PersonalAcc=${REQUISITES.acc}|BankName=${REQUISITES.bank}|BIC=${REQUISITES.bic}|CorrespAcc=${REQUISITES.corAcc}|PayeeINN=${REQUISITES.inn}`;
    
    if (REQUISITES.kpp) {
        qrString += `|KPP=${REQUISITES.kpp}`;
    }
    if (payerName) {
        qrString += `|LastName=${payerName}`; // Поле LastName используется большинством банков для полного ФИО плательщика
    }
    if (purpose) {
        qrString += `|Purpose=${purpose}`;
    }
    qrString += `|Sum=${sumInKopecks}`;

    // Очистка контейнера
    const container = document.getElementById("qrcode");
    container.innerHTML = "";

    try {
        // typeNumber = 0 означает автоматический подбор размера матрицы
        // 'M' (Medium) = 15% коррекции ошибок (оптимально для платежей)
        const qr = qrcode(0, 'M');
        qr.addData(qrString);
        qr.make();
        
        // Вставляем SVG в контейнер
        container.innerHTML = qr.createSvgTag(4, 0); // 4 = размер модуля, 0 = отступ
    } catch (e) {
        container.innerHTML = `<span style="color:red; font-size:14px; text-align:center;">Ошибка генерации:<br>${e.message}</span>`;
        console.error(e);
    }
}

// =====================================================================
// 3. ФУНКЦИЯ СКАЧИВАНИЯ САМОГО СЕБЯ
// =====================================================================
function downloadSelf() {
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "QR_Oplata.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

</body>
</html>
